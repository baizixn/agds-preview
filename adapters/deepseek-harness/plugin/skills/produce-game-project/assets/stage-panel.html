<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>阶段进度</title><style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#19354b;background:#f8f6f0}*{box-sizing:border-box}body{margin:0}main{max-width:1440px;margin:auto;padding:30px 36px}header,.row,.toolbar,.stats{display:flex;gap:16px;align-items:center;justify-content:space-between}.muted{color:#647888;font-size:14px}.badge{display:inline-block;background:#fff0cc;color:#8b620c;border-radius:30px;padding:5px 11px;font-size:13px}h1{font-size:30px;margin:8px 0}h2{font-size:26px;margin:8px 0}h3{margin:0 0 12px}button{font:inherit;background:white;border:1px solid #d8e1e2;border-radius:10px;color:#284a5a;padding:9px 14px;cursor:pointer}button.active{background:#185d70;color:white}.tabs{display:flex;gap:8px;overflow:auto;padding:22px 0}.card{background:white;border:1px solid #e2e8e6;border-radius:18px;padding:22px;box-shadow:0 4px 22px #12332209}.grid{display:grid;grid-template-columns:2fr 1fr;gap:16px}.stats{justify-content:flex-start;align-items:stretch;margin-top:20px}.stat{flex:1;background:#f0f8f8;padding:16px;border-radius:12px}.stat strong{display:block;font-size:24px;color:#087c8b;margin:6px 0}.delivery{background:#f8faf5;margin-top:16px}.columns{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.items{margin-top:16px}.item{padding:16px 0;border-top:1px solid #edf0ef}.item:first-of-type{border:0}.pill{color:#087c8b;font-size:13px;margin-left:8px}details{margin-top:10px;color:#596f7d;font-size:14px;overflow-wrap:anywhere}summary{cursor:pointer}li{margin:6px 0}.toolbar{margin:20px 0;flex-wrap:wrap}.filters{display:flex;gap:6px}.error{display:none;position:fixed;inset:0;background:#213440df;color:white;z-index:10;padding:20vh 15%;font-size:22px}#note{min-height:1.5em}@media(max-width:700px){main{padding:20px 16px}.grid,.columns{grid-template-columns:1fr}.stats{flex-wrap:wrap}.stat{min-width:130px}header{align-items:flex-start;flex-direction:column}h1{font-size:25px}}
.bar{height:9px;background:#dbe9e9;border-radius:9px;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;background:#16899a}.bar.uncertain i{background:#d3a342}.copyarea{width:100%;min-height:140px}@media(max-width:700px){header>div:last-child{display:flex;flex-wrap:wrap;gap:6px}}@media print{button,.tabs,.toolbar,.error{display:none!important}details>summary{display:none}details:not([open])>*{display:block}details{display:block}details:not([open]){display:block} .print-all{display:block!important}.items .item{display:none}.print-all .item{display:block!important}body{background:white}.card{box-shadow:none;break-inside:avoid}}.print-all{display:none}</style></head><body><div class="error" id="error">数据读取失败或来源已变化，当前画面已过期。请修复来源后刷新。</div><main><header><div><div class="muted">PROJECT STAGES / 阶段进度</div><h1 id="project"></h1><div class="muted" id="updated"></div></div><div><button id="copy">复制交付摘要</button> <button id="refresh">刷新</button> <button onclick="print()">打印</button></div></header><div class="tabs" id="tabs"></div><div id="content"></div><p class="muted" id="note"></p></main><script>
'use strict';const data=/*PANEL_DATA*/;const p=data.panel, sums=data.summary.stages;let selected=Math.max(0,p.stages.findIndex(s=>s.execution==='active')),filter='all';const labels={candidate:'候选，未批准',approved:'已批准',planned:'计划中',active:'进行中',paused:'已暂停',pending:'尚未验收',accepted:'已验收',rejected:'验收需处理',progress:'项目进展',partial_test:'局部测试',stage_review:'阶段评审',unknown:'未核实',todo:'待开始',in_progress:'进行中',done:'已完成',blocked:'受阻',not_run:'未测试',pass:'通过',fail:'未通过',stale:'已过期',inconclusive:'结论不明确',Must:'必需',Should:'应做',Could:'可做',Deferred:'暂缓'};const zh=x=>labels[x]||x;const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const list=a=>a.length?'<ul>'+a.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'<p class="muted">未提供</p>';const effective=(s,i)=>{let a=i.implementation.state,b=i.verification.state,r=s.artifact_revision,valid=r&&r.toLowerCase()!=='unknown';if(a==='done'&&!(i.implementation.evidence.trim()&&valid&&i.implementation.revision===r))a='unknown';if(b==='pass'&&!(a==='done'&&i.verification.evidence.trim()&&i.verification.environment.trim()&&valid&&i.verification.revision===r))b=i.verification.revision&&valid&&i.verification.revision!==r?'stale':'unknown';return [a,b]};
const meter=(count,n,unknown,scope)=>!n.total?'无必需项':unknown?'未核实<div class="bar uncertain" role="progressbar" aria-label="条目进度" aria-valuetext="未核实"></div><div class="muted">尚无已确认结果 / '+n.total+' 个'+(scope==='candidate'?'候选':'当前')+'必需项</div>':count+' / '+n.total+' 项<div class="bar '+(n.unknown?'uncertain':'')+'" role="progressbar" aria-label="已确认条目" aria-valuemin="0" aria-valuemax="'+n.total+'" aria-valuenow="'+count+'"><i style="width:'+count/n.total*100+'%"></i></div>';function draw(){let s=p.stages[selected],n=sums[selected];document.getElementById('project').textContent=p.project;document.getElementById('updated').textContent='更新时间：'+new Date(p.updated_at).toLocaleString('zh-CN',{hour12:false})+' · '+(data.live?'本地实时读取':'本地快照，AI 更新后请刷新');document.getElementById('tabs').innerHTML=p.stages.map((x,i)=>`<button data-index="${i}" class="${i===selected?'active':''}">${esc(x.id)}</button>`).join('');document.querySelectorAll('[data-index]').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.index);draw()});let items=s.items.filter(i=>{let [a,b]=effective(s,i);return filter==='all'||(filter==='unfinished'&&a!=='done')||(filter==='verify'&&a==='done'&&b!=='pass')});document.getElementById('content').innerHTML=`<div class="grid"><section class="card"><span class="badge">${esc(zh(s.scope_state))} · ${esc(zh(s.execution))} · ${esc(n.label)}</span><h2>${esc(s.id)} ${esc(s.title)}</h2><div>${esc(s.goal)}</div><div class="stats"><div class="stat">必需项实现<strong>${meter(n.implemented,n,n.implemented===0&&s.items.filter(i=>i.scope==='Must').every(i=>effective(s,i)[0]==='unknown'),s.scope_state)}</strong>条目数覆盖，不代表工时；仅计有证据且版本一致</div><div class="stat">必需项验证<strong>${meter(n.verified,n,n.verified===0&&s.items.filter(i=>i.scope==='Must').every(i=>['unknown','not_run'].includes(effective(s,i)[1])),s.scope_state)}</strong>条目数覆盖，不代表工时；未知 ${n.unknown} 项</div></div></section><section class="card"><h3>Owner 验收</h3><span class="badge">${esc(zh(s.owner_acceptance.state))}</span><p>${s.owner_acceptance.state==='accepted'?'Owner 已验收':s.owner_acceptance.state==='rejected'?'Owner 已拒绝，需处理':n.ready?'已具备提交验收条件':'尚未具备提交验收条件'}</p><details><summary>范围与验收来源</summary><p>${esc(s.scope_evidence||'范围来源未提供')}</p><p>${esc(s.owner_acceptance.evidence||'验收来源未提供')}</p></details></section></div><section class="card delivery"><h3>本次交付</h3><p>关联阶段：${esc((p.delivery.stage_ids||[]).join('、')||'项目进展（未指定阶段）')}</p><p>${esc(p.delivery.summary)} <span class="badge">${esc(zh(p.delivery.kind))}</span></p><div class="columns"><div><b>仅测什么</b>${p.delivery.test_scope.length?list(p.delivery.test_scope):'<p class="muted">本次不请求测试</p>'}</div><div><b>预期</b>${list(p.delivery.expected)}</div><div><b>未完成</b>${list(p.delivery.not_ready)}</div></div></section><div class="toolbar"><h3>阶段明细</h3><div class="filters"><button data-filter="all" class="${filter==='all'?'active':''}">全部</button><button data-filter="unfinished" class="${filter==='unfinished'?'active':''}">未完成</button><button data-filter="verify" class="${filter==='verify'?'active':''}">待验证</button></div></div><section class="card items">${items.length?items.map(i=>{let [a,b]=effective(s,i);return `<div class="item"><b>${esc(i.id)} ${esc(i.title)}</b><span class="pill">${esc(zh(i.scope))}</span><p>实现：${esc(zh(a))}　验证：${esc(zh(b))}</p><details><summary>来源与证据</summary><p>原条目：${esc(i.source_ref)}</p><p>实现证据：${esc(i.implementation.evidence||'未提供')} · 版本 ${esc(i.implementation.revision||'未知')}</p><p>验证证据：${esc(i.verification.evidence||'未提供')} · 版本 ${esc(i.verification.revision||'未知')} · 环境 ${esc(i.verification.environment||'未知')}</p></details></div>`}).join(''):'<p class="muted">当前筛选没有条目</p>'}<details><summary>计划条件、测试与退出条件</summary><p>依赖：${esc(s.dependencies.join('、')||'无')}</p><b>计划前置条件</b>${list(s.conditions)}<b>计划验证项</b>${list(s.tests)}<b>退出条件</b><p>${esc(s.exit)}</p></details><details><summary>来源快照</summary><p>${esc(p.source.label)} · ${esc(p.source.path)}</p><p>${esc(p.source.sha256)}</p></details><div class="print-all">${s.items.map(i=>{let [a,b]=effective(s,i);return `<div class="item"><b>${esc(i.id)} ${esc(i.title)} · ${esc(zh(i.scope))}</b><p>实现：${esc(zh(a))}　验证：${esc(zh(b))}</p><p>来源：${esc(i.source_ref)}　实现证据：${esc(i.implementation.evidence||'未提供')}　验证证据：${esc(i.verification.evidence||'未提供')}　环境：${esc(i.verification.environment||'未知')}</p></div>`}).join('')}</div></section>`;document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;draw()})}
draw();document.getElementById('refresh').onclick=()=>location.reload();document.getElementById('copy').onclick=async()=>{let d=p.delivery,s=p.stages[selected],n=sums[selected],pending=s.items.filter(i=>i.scope==='Must'&&(effective(s,i)[0]!=='done'||effective(s,i)[1]!=='pass'));let t=`${p.project} / ${s.id} ${s.title}\n阶段：${zh(s.execution)}；范围：${zh(s.scope_state)}；验收：${zh(s.owner_acceptance.state)}\n实现：${n.label==='未核实'?'未核实':n.implemented+' / '+n.total}；验证：${n.label==='未核实'?'未核实':n.verified+' / '+n.total}（条目数，非工时）\n未完成必需项：${pending.map(i=>i.id+' '+i.title).join('；')||'无'}\n本次交付关联阶段：${(d.stage_ids||[]).join('、')||'项目进展（未指定阶段）'}\n${d.summary}\n仅测：${d.test_scope.join('；')}\n预期：${d.expected.join('；')}\n未完成：${d.not_ready.join('；')}`;let ok=false;try{await navigator.clipboard.writeText(t);ok=true}catch(e){let a=document.createElement('textarea');a.className='copyarea';a.value=t;document.getElementById('note').replaceChildren(a);a.select();try{ok=document.execCommand('copy')}catch(e){}}if(ok)document.getElementById('note').textContent='已复制交付摘要';else document.getElementById('note').prepend('复制失败，请手动选择下方文本复制：')};if(data.live){let baseline=document.documentElement.outerHTML;setInterval(async()=>{try{let r=await fetch(location.href,{cache:'no-store'});if(!r.ok)throw Error();let t=await r.text();let m=t.match(/const data=(.*?);const p=data.panel/s);if(!m||JSON.stringify(JSON.parse(m[1]))!==JSON.stringify(data))location.reload();else document.getElementById('error').style.display='none'}catch(e){document.getElementById('error').style.display='block'}},15000)}
</script></body></html>
